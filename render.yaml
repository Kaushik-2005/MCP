services:
  - type: web
    name: researchops-mcp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_PATH
        value: /tmp/researchops.db
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_STATELESS_HTTP
        value: "true"
      - key: MCP_STREAMABLE_HTTP_PATH
        value: /mcp
