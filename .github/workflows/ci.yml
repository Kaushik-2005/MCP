name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Syntax check
        run: python -m compileall src tests

      - name: Run tests
        run: pytest

      - name: Run evaluation gate
        run: python -m researchops_mcp.evals --fail-on-thresholds

  image-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t researchops-mcp:ci .
