name: Evaluation Regression

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run focused Day 12 tests
        run: pytest tests/unit/test_eval_runner.py

      - name: Run evaluation regression gate
        run: python -m researchops_mcp.evals --fail-on-thresholds
